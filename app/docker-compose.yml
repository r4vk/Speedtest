services:
  speedtest:
    image: ghcr.io/r4vk/speedtest:latest
    container_name: r4vk-speedtest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - speedtest-data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Warsaw
      # Anonymous telemetry (opt-out in UI):
      # - TELEMETRY_DEFAULT_ENABLED=true
      # - SPEEDTEST_URL=https://example.com/largefile.iso
      # - SPEEDTEST_INTERVAL_SECONDS=900
      # - CONNECT_TARGET=google.com
      # SMTP notifications (uncomment and fill to enable):
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_USER=your-email@gmail.com
      # - SMTP_PASSWORD=your-app-password
      # - SMTP_FROM=your-email@gmail.com
      # - SMTP_TO=recipient@example.com
      # - SMTP_USE_TLS=true
      # Network quality monitoring (see app/README.md "Monitoring jakości łącza"):
      # - GATEWAY_HOST=192.168.1.1
      # - DEVICE_ID=nas
      # - PROBE_MAX_CONCURRENCY=16
      # - PROBE_FLUSH_SECONDS=5
      # - PROBE_FLUSH_MAX=500
      # - PROBE_BUFFER_HARD_MAX=20000
    # Only needed if /api/quality/status reports icmp_method other than "dgram"
    # (some Synology DSM/container setups block unprivileged ICMP sockets).
    # Pick ONE of the two options below, not both:
    # cap_add:
    #   - NET_RAW
    # sysctls:
    #   - net.ipv4.ping_group_range=0 2147483647

volumes:
  speedtest-data:
