[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    network: touches the real network
addopts = -m "not network"
filterwarnings =
    ; deprecations inside dependencies / the legacy startup hooks, not our tests
    ignore:(?s).*on_event is deprecated:DeprecationWarning
    ignore:(?s).*BlockingPortal alias is deprecated:DeprecationWarning
