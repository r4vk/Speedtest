[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    network: touches the real network
addopts = -m "not network"
filterwarnings =
    ; deprecation inside a dependency (anyio via starlette), not our code
    ignore:(?s).*BlockingPortal alias is deprecated:DeprecationWarning
